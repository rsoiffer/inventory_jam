[workspace]
members = ["crates/core", "crates/main-bevy", "crates/main-godot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
publish = false
authors = ["PIGSquad Rustaceans"]
edition = "2024"

[profile.dev.package."*"]
opt-level = 3

# Keep workspace code lightly optimized for iterative rebuilds, while cutting
# debuginfo to line tables to speed up linking (Bevy setup guide).
[profile.dev]
opt-level = 1
debug = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
targets = ["x86_64-pc-windows-gnu", "x86_64-unknown-linux-gnu"]
ci = []

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "2d_api",
    "2d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "scene",
    "picking",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "tonemapping_luts",
    "zstd_rust",
    "webgl2",
    "x11",
    "wayland",
    "sysinfo_plugin",
] }
bevy_kira_audio = { version = "0.26" }
bevy_asset_loader = { version = "0.27" }
rand = { version = "0.9" }
virtual_joystick = "2.8.0"
webbrowser = { version = "1", features = ["hardened"] }

winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
lightyear = { version = "0.28.0", features = [
    "interpolation",
    "prediction",
    "replication",
    "leafwing",
] }
leafwing-input-manager = { version = "0.21", features = [
    "keyboard",
    "gamepad",
    "mouse",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
bevy-inspector-egui = { version = "0.37.0" }
bevy_mod_reqwest = "0.22.0"
async-compat = "0.2.5"
anyhow = "1.0.103"
aeronet_io = "0.21.0"
clap = { version = "4.6.1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "json",
    "macros",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = { version = "0.10" }
hex = { version = "0.4" }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "InputEvent",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Node",
    "Window",
] }
embed-resource = "3.0.11"
gdenv-lib = { package = "gdenv-lib", path = "../../gdenv/gdenv-lib" }
godot = "0.4"

[patch.crates-io]
xwt-web = { path = "vendor/xwt-web" }
