[package]
name = "inventory_jam"
version = "0.1.0"
publish = false
authors = ["PIGSquad Rustaceans"]
edition = "2024"
exclude = ["dist", "build", "assets"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
    "dep:bevy-inspector-egui",
]
default = ["client", "gui", "server", "netcode", "udp", "webtransport", "dev"]
client = ["lightyear/client"]
gui = []
server = ["lightyear/client", "lightyear/server"]
netcode = ["lightyear/netcode"]
udp = ["lightyear/udp", "lightyear/std"]
link_conditioner = []
webtransport = [
    "lightyear/webtransport",
    "lightyear/webtransport_self_signed",
    "lightyear/webtransport_dangerous_configuration",
]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "2d_api",
    "2d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "scene",
    "picking",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "sysinfo_plugin",
] }
bevy_kira_audio = { version = "0.26" }
bevy_asset_loader = { version = "0.27" }
rand = { version = "0.9" }
webbrowser = { version = "1", features = ["hardened"] }

winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
lightyear = { version = "0.28.0", features = [
    "interpolation",
    "prediction",
    "replication",
    "leafwing",
] }
leafwing-input-manager = { version = "0.21", features = [
    "keyboard",
    "gamepad",
    "mouse",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
bevy-inspector-egui = { version = "0.37.0", optional = true }
bevy_mod_reqwest = "0.22.0"
async-compat = "0.2.5"
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "Window"] }

[patch.crates-io]
xwt-web = { path = "vendor/xwt-web" }

[build-dependencies]
embed-resource = "3.0.11"

[package.metadata.bevy_cli.web]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
default-features = false
features = ["client", "gui", "netcode", "webtransport"]
