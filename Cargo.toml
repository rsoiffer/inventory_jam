[package]
name = "inventory_jam"
version = "0.1.0"
publish = false
authors = ["PIGSquad Rustaceans"]
edition = "2024"
exclude = ["dist", "build", "assets"]

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.dev.package."*"]
opt-level = 3

# Keep workspace code lightly optimized for iterative rebuilds, while cutting
# debuginfo to line tables to speed up linking (Bevy setup guide).
[profile.dev]
opt-level = 1
debug = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
    "dep:bevy-inspector-egui",
]
default = ["client", "gui", "server", "netcode", "udp", "dev"]
client = ["lightyear/client"]
gui = []
server = [
    "lightyear/client",
    "lightyear/server",
    "dep:sqlx",
    "dep:tokio",
    "dep:uuid",
    "dep:sha2",
    "dep:hex",
]
netcode = ["lightyear/netcode"]
udp = ["lightyear/udp", "lightyear/std"]
link_conditioner = []

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "2d_api",
    "2d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "scene",
    "picking",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    "sysinfo_plugin",
] }
bevy_kira_audio = { version = "0.26" }
bevy_asset_loader = { version = "0.27" }
rand = { version = "0.9" }
webbrowser = { version = "1", features = ["hardened"] }

winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
lightyear = { version = "0.28.0", features = [
    "interpolation",
    "prediction",
    "replication",
    "leafwing",
] }
leafwing-input-manager = { version = "0.21", features = [
    "keyboard",
    "gamepad",
    "mouse",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
bevy-inspector-egui = { version = "0.37.0", optional = true }
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "json",
    "macros",
], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

[build-dependencies]
embed-resource = "3.0.11"
