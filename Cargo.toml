[package]
name = "inventory_jam"
version = "0.1.0"
publish = false
authors = ["PIGSquad Rustaceans"]
edition = "2024"
exclude = ["dist", "build", "assets"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
]
default = ["client", "gui", "server", "netcode", "dev"]
client = ["lightyear/client", "lightyear_examples_common/client"]
gui = ["lightyear_examples_common/gui2d"]
server = [
    "lightyear/client",
    "lightyear/server",
    "lightyear_examples_common/client",
    "lightyear_examples_common/server",
]
netcode = ["lightyear_examples_common/netcode"]
udp = ["lightyear_examples_common/udp", "lightyear/std", "lightyear/udp"]
steam = ["lightyear_examples_common/steam"]
webtransport = [
  "lightyear/webtransport",
  "lightyear/webtransport_self_signed",
  "lightyear/webtransport_dangerous_configuration",
]

# All of Bevy's default features exept for the audio related ones (bevy_audio, vorbis), since they clash with bevy_kira_audio
[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "2d_api",
    "2d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "sysinfo_plugin",
] }
bevy_kira_audio = { version = "0.26" }
bevy_asset_loader = { version = "0.27" }
rand = { version = "0.9" }
webbrowser = { version = "1", features = ["hardened"] }

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
lightyear = { version = "0.28.0", features = [
    "interpolation",
    "prediction",
    "replication",
    "input_native",
] }
lightyear_examples_common = "0.28.0"
leafwing-input-manager = { version = "0.21", features = [
    "keyboard",
    "gamepad",
    "mouse",
], default-features = false }
serde = "1.0.228"
clap = "4.6.1"
cfg-if = "1.0.4"

# Required to make `rand`/`getrandom` work on wasm.
# Backend is selected via `.cargo/config.toml` rustflags for the wasm32-unknown-unknown target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[build-dependencies]
embed-resource = "3.0.11"

[package.metadata.bevy_cli.web]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
default-features = false
features = ["client", "netcode", "webtransport"]
